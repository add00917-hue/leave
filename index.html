<style>
:root{
  --navy-deep:#07182E;--navy-dark:#0A2342;--navy:#15396E;--navy-mid:#2C5BA0;--navy-soft:#3D6BB0;
  --yellow:#FFC52E;--yellow-bright:#FFD449;--yellow-dark:#F4A810;--yellow-pale:#FFF6DE;
  --canvas:#F4F7FC;--card:#FFFFFF;--ink:#0E2138;--ink-mid:#46587A;--ink-soft:#8593AC;--line:#E2E8F2;
  --success:#10B981;--success-bg:#E7F8F1;--warning:#F59E0B;--warning-bg:#FEF4E2;--danger:#EF4444;--danger-bg:#FCEBEB;
  --c-sick:#EF4444;--c-personal:#6366F1;--c-other:#8B5CF6;--c-vacation:#10B981;--c-internal:#0EA5E9;--c-esv:#0891B2;--c-event:#EC4899;--c-overtime:#F97316;--c-offsite:#14B8A6;
  --r:18px;--r-sm:12px;--pill:50px;--font:'Prompt',sans-serif;--mono:'IBM Plex Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:var(--font);background:var(--navy-deep);color:var(--ink);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.hidden{display:none!important}
:focus,:focus-visible{outline:none}
::-webkit-scrollbar{width:0;height:0}

/* device frame */
.device{max-width:440px;margin:0 auto;height:100vh;height:100dvh;background:var(--canvas);position:relative;overflow:hidden;display:flex;flex-direction:column}
@media(min-width:480px){
  body{padding:24px 0;background:radial-gradient(120% 80% at 50% 0%,#16386e,#07182e)}
  .device{min-height:calc(100vh - 48px);height:880px;border-radius:42px;box-shadow:0 40px 90px rgba(0,0,0,.5),0 0 0 11px #0d1b30,0 0 0 13px #1e2d45;overflow:hidden}
}

/* ===== LOGIN ===== */
.login{position:absolute;inset:0;z-index:50;background:radial-gradient(120% 90% at 50% 0%,#20477F,#0C2A4E 52%,#07182E);display:flex;flex-direction:column;justify-content:center;padding:30px 26px;color:#fff;overflow-y:auto}
.login .glow{position:absolute;border-radius:50%;filter:blur(64px);opacity:.55}
.login .glow.y{width:260px;height:260px;background:rgba(198,57,43,.28);top:-70px;right:-60px}
.login .glow.b{width:320px;height:320px;background:rgba(61,107,176,.5);bottom:-100px;left:-80px}
.login-inner{position:relative;z-index:2;text-align:center;width:100%;max-width:400px;margin:0 auto}
.lg-mark{width:min(272px,66vw);height:auto;aspect-ratio:1;display:flex;align-items:center;justify-content:center;margin:0 auto 4px}
.lg-mark img{width:100%;height:100%;object-fit:contain}
.lg-word{font-family:var(--mono);font-weight:600;font-size:40px;letter-spacing:1px;line-height:1}.lg-word .ac{color:var(--yellow-bright)}
.lg-sub{font-size:12.5px;color:rgba(255,255,255,.55);margin-top:0;line-height:1.5}
.lg-conn{display:inline-flex;align-items:center;gap:8px;margin:16px auto 0;padding:7px 16px;border-radius:999px;font-size:12.5px;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:rgba(255,255,255,.85);align-self:center}
.lg-conn .dot{width:7px;height:7px;border-radius:50%;background:#f5b301;box-shadow:0 0 0 3px rgba(245,179,1,.22);animation:lgpulse 1.6s infinite}
.lg-conn.on .dot{background:#10b981;box-shadow:0 0 0 3px rgba(16,185,129,.25)}
.lg-conn.off .dot{background:#ef4444;box-shadow:0 0 0 3px rgba(239,68,68,.22);animation:none}
@keyframes lgpulse{0%,100%{opacity:1}50%{opacity:.45}}
.lg-form{margin-top:26px;display:flex;flex-direction:column;gap:13px;text-align:left;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.14);border-radius:24px;padding:22px 20px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.lg-field label{font-size:12px;color:rgba(255,255,255,.65);font-weight:500;display:block;margin-bottom:7px}
.lg-field input{width:100%;padding:16px 18px;border-radius:16px;border:1px solid transparent;background:rgba(255,255,255,.09);color:#fff;font-size:16px;outline:none;transition:.16s}
.lg-field input:focus{background:rgba(255,255,255,.16)}
.lg-field input::placeholder{color:rgba(255,255,255,.45)}
.lg-btn{margin-top:6px;padding:16px;border-radius:16px;background:linear-gradient(180deg,#F6F8FC,#D2DAE6);color:#12283F;font-size:16px;font-weight:700;letter-spacing:.4px;box-shadow:0 10px 24px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;gap:9px;transition:.14s}
.lg-btn:active{transform:scale(.98)}
.lg-btn svg{width:21px;height:21px;flex-shrink:0}
.lg-status{font-size:12.5px;margin-top:12px;text-align:center;min-height:16px;font-weight:600}
.lg-status.err{color:#FCA5A5}.lg-status.wait{color:#FCD34D}
.lg-hint{margin-top:14px;font-size:11.5px;color:rgba(255,255,255,.5);text-align:center;line-height:1.6}
.lg-foot{position:absolute;bottom:20px;left:0;right:0;text-align:center;font-size:10.5px;color:rgba(255,255,255,.35);font-family:var(--mono);z-index:2}

/* ===== APP HEADER ===== */
.appbar{background:linear-gradient(135deg,var(--navy-dark),var(--navy));color:#fff;padding:calc(20px + env(safe-area-inset-top)) 20px 18px;flex-shrink:0;position:relative;overflow:hidden}
.appbar .bg{position:absolute;width:200px;height:200px;border-radius:50%;background:rgba(61,107,176,.22);filter:blur(40px);top:-90px;right:-50px}
.ab-top{display:flex;align-items:center;gap:12px;position:relative;z-index:2}
.ab-ava{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,var(--navy-soft),var(--navy-mid));display:flex;align-items:center;justify-content:center;font-weight:600;font-size:18px;flex-shrink:0}
.ab-hi{font-size:12.5px;color:rgba(255,255,255,.6)}.ab-name{font-size:16px;font-weight:700}
.ab-bell{margin-left:auto;width:44px;height:44px;border-radius:12px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;position:relative}
.ab-bell svg{width:20px;height:20px}.ab-bell .d{position:absolute;top:10px;right:11px;width:8px;height:8px;border-radius:50%;background:var(--yellow);border:2px solid var(--navy)}
.ab-conn{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:20px;font-size:11.5px;font-weight:600;white-space:nowrap;flex-shrink:0;transition:.2s;line-height:1}
.ab-conn .d{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.ab-conn.on{background:rgba(34,197,94,.18);color:#86EFAC}.ab-conn.on .d{background:#34D399;box-shadow:0 0 0 3px rgba(52,211,153,.22)}
.ab-conn.off{background:rgba(239,68,68,.2);color:#FCA5A5}.ab-conn.off .d{background:#F87171}
.ab-conn.wait{background:rgba(245,179,1,.2);color:#FCD34D}.ab-conn.wait .d{background:#FBBF24;animation:pulse 1.4s infinite}
.ab-conn svg{flex-shrink:0}.cp-spin{animation:spin .8s linear infinite;transform-origin:center}
.ab-title{font-size:20px;font-weight:700;position:relative;z-index:2}
.ab-sub{font-size:12.5px;color:rgba(255,255,255,.6);position:relative;z-index:2;margin-top:2px}

/* ===== SCREENS ===== */
.screens{flex:1;overflow-y:auto;padding:18px 16px calc(96px + env(safe-area-inset-bottom))}
.screen{display:none;animation:fade .3s}.screen.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.qstats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:18px}
.db-bar{display:flex;align-items:center;gap:9px;padding:11px 14px;border-radius:14px;font-size:12.5px;font-weight:600;margin-bottom:15px}
.db-bar .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.db-bar.wait{background:var(--warning-bg);color:#B47400}.db-bar.wait .dot{background:var(--warning);animation:pulse 1.4s infinite}
.db-bar.on{background:var(--success-bg);color:#0B7A55}.db-bar.on .dot{background:var(--success)}
.db-bar.off{background:#FDECEC;color:#C0392B}.db-bar.off .dot{background:var(--danger)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
/* ===== connecting overlay (spinner popup) ===== */
.conn-ov{position:absolute;inset:0;background:rgba(15,28,48,.28);z-index:80;display:none;align-items:center;justify-content:center}
.conn-ov.open{display:flex;animation:fade .2s}
.conn-card{background:rgba(255,255,255,.55);backdrop-filter:blur(14px) saturate(1.4);-webkit-backdrop-filter:blur(14px) saturate(1.4);border:1px solid rgba(255,255,255,.65);border-radius:24px;padding:26px 30px;display:flex;flex-direction:column;align-items:center;gap:15px;box-shadow:0 16px 44px rgba(7,24,46,.22)}
.spinner12{width:48px;height:48px;position:relative;animation:spin 1s steps(12) infinite}
.spinner12 span{position:absolute;top:0;left:50%;width:4.5px;height:13px;margin-left:-2.25px;border-radius:3px;transform-origin:center 24px;transform:rotate(var(--r));background:var(--c)}
.conn-card .txt{font-size:13px;font-weight:600;color:var(--navy)}
@keyframes spin{to{transform:rotate(360deg)}}
.qstat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 12px;text-align:center;box-shadow:0 2px 8px rgba(10,35,66,.05)}
.qstat b{font-family:var(--mono);font-size:24px;font-weight:600;display:block;line-height:1}
.qstat span{font-size:11px;color:var(--ink-soft);margin-top:5px;display:block}
.qstat.a b{color:var(--yellow-dark)}.qstat.r b{color:var(--danger)}.qstat.g b{color:var(--success)}

.sec-h{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 12px}
.sec-h h3{font-size:15px;font-weight:700}.sec-h a{font-size:12.5px;color:var(--navy);font-weight:600}

.qa-grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.qa{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:15px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 8px rgba(10,35,66,.05);transition:.14s}
.qa:active{transform:scale(.97)}
.qa .ic{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.qa .ic svg{width:21px;height:21px;color:#fff}
.qa .t{font-size:13.5px;font-weight:600;line-height:1.2}.qa .s{font-size:11px;color:var(--ink-soft)}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 2px 8px rgba(10,35,66,.05)}
.rec-item{display:flex;gap:12px;padding:14px;border-bottom:1px solid #EEF2F8;align-items:center}
.rec-item:last-child{border-bottom:none}
.rec-item .bar{width:4px;align-self:stretch;border-radius:3px;flex-shrink:0}
.rec-b{flex:1;min-width:0}.rec-t{font-size:14px;font-weight:600;line-height:1.25}
.rec-m{font-size:11.5px;color:var(--ink-soft);margin-top:3px}
.cat-pill{font-size:10px;font-weight:600;padding:2px 8px;border-radius:var(--pill);color:#fff;white-space:nowrap;display:inline-block}
.st{font-size:11px;font-weight:600;padding:4px 10px;border-radius:var(--pill);white-space:nowrap}
.st-pending{background:var(--warning-bg);color:#B47400}.st-approved{background:var(--success-bg);color:#0B7A55}
.st-rejected{background:var(--danger-bg);color:#C0392B}.st-cancelled{background:#EDF1F8;color:var(--ink-soft)}.st-none{background:#E8EEF8;color:var(--navy)}

/* calendar */
.cal-card{padding:16px}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-h .t{font-size:16px;font-weight:700}.cal-h .t .en{font-size:11px;color:var(--ink-soft);font-family:var(--mono);font-weight:500}
.cal-h button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--ink-mid)}
.cal-h button svg{width:16px;height:16px}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dow{text-align:center;font-size:10px;color:var(--ink-soft);font-weight:600;padding:4px 0}
.cal-c{aspect-ratio:1;border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:13px;font-weight:600;cursor:pointer;position:relative;border:1.5px solid transparent;color:var(--ink);transition:.12s}
.cal-c.muted{color:transparent;pointer-events:none}
.cal-c.today{background:var(--navy);color:#fff}
.cal-c.sel{border-color:var(--navy)}
.cal-c.pick{background:var(--navy);color:#fff;border-color:var(--navy)}
.daychips{display:flex;flex-wrap:wrap;gap:6px}
.daychip{background:#EEF1F5;color:var(--navy);font-size:12px;font-weight:600;padding:5px 11px;border-radius:20px}
.tt-row{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.tt-del{width:40px;height:40px;border-radius:10px;background:#FCEBEB;color:#C0392B;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tt-del svg{width:18px;height:18px}
/* week/month toggle + week timeline */
.seg{display:flex;background:#E9EEF6;border-radius:20px;padding:3px}
.seg span{font-size:12px;color:var(--ink-mid);padding:10px 15px;min-height:38px;display:inline-flex;align-items:center;border-radius:17px;cursor:pointer;transition:.15s}
.seg span.seg-on{background:var(--navy);color:#fff;font-weight:600}
.wk-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.wk-strip>div{cursor:pointer}
.wk-day{width:34px;height:34px;margin:0 auto;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;font-family:var(--mono);color:var(--ink)}
.wk-day.on{background:var(--navy);color:#fff}
.wk-dot{width:5px;height:5px;border-radius:50%;display:inline-block}
.allday-row{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:4px}
.ad-chip{flex:1;min-width:135px;display:flex;align-items:center;gap:8px;border-radius:11px;padding:8px 10px;cursor:pointer}
.ad-t{font-size:12px;font-weight:700;line-height:1.1}.ad-s{font-size:10.5px;color:var(--ink-mid)}
.tl-wrap{position:relative;margin-left:44px;margin-top:6px}
.tl-line{position:absolute;left:0;right:0;border-top:1px solid #EEF2F7}
.tl-hr{position:absolute;left:-44px;font-size:10px;color:#A6B0BC;font-family:var(--mono)}
.tl-lane{position:absolute;inset:0}
.tl-block{position:absolute;border-radius:11px;padding:8px 10px;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;cursor:pointer}
.tl-t{font-size:12.5px;font-weight:700;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tl-s{font-size:10.5px;color:var(--ink-mid);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.tl-pill{font-size:10px;font-weight:600;padding:2px 8px;border-radius:12px;display:inline-block;margin-top:auto}
.cal-c.we:not(.today){color:var(--ink-soft)}
.cal-c.holi{background:#FCEBEB;color:#C0392B}
.cal-c .cnt{position:absolute;top:2px;right:4px;font-size:9px;font-weight:700;font-family:var(--font)}
.cal-legend{display:flex;flex-wrap:wrap;gap:8px 13px;padding:14px 4px 2px;font-size:10.5px;color:var(--ink-mid)}
.cal-legend span{display:flex;align-items:center;gap:5px}
.cal-legend i{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0}
.holi-tip{display:flex;align-items:center;gap:7px;padding:9px 12px;border-radius:11px;background:#FCEBEB;color:#C0392B;font-size:12.5px;font-weight:600;margin-bottom:12px}
.holi-tip svg{width:15px;height:15px;flex-shrink:0}
/* avatars */
.ava{border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:600;overflow:hidden;flex-shrink:0;background:var(--navy);line-height:1}
.ava img{width:100%;height:100%;object-fit:cover;display:block}
.ava svg{width:55%;height:55%}
.ava.ghost{background:#EEF1F5;color:var(--ink-soft)}
.ava.more{background:#E7ECF4;color:var(--ink-mid);font-weight:700}
.ava-stack{display:flex}.ava-stack>*{border:2px solid #fff;margin-left:-10px}.ava-stack>*:first-child{margin-left:0}
/* tinted day cards */
.tk-card{display:flex;align-items:center;gap:11px;padding:12px;border-radius:14px;margin-bottom:8px;cursor:pointer}
.tk-b{flex:1;min-width:0}
.tk-t{font-size:14px;font-weight:700;color:var(--ink);line-height:1.25}
.tk-m{font-size:12px;color:var(--ink-mid);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* task rows + pill buttons */
.grp-h{font-size:12px;color:var(--ink-soft);font-weight:600;margin:14px 2px 9px}
.task-row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:9px;box-shadow:0 2px 8px rgba(10,35,66,.04);cursor:pointer}
.date-col{width:46px;text-align:center;flex-shrink:0;border-right:1px solid #EEF2F8;padding-right:10px;line-height:1.15}
.date-col b{font-family:var(--mono);font-size:17px;font-weight:700;display:block}
.date-col span{font-size:10px;color:var(--ink-soft);display:block}
.task-b{flex:1;min-width:0}
.task-sub{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-mid);margin-top:4px}
.task-sub span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{border:none;border-radius:22px;padding:8px 16px;min-height:44px;font-size:12.5px;font-weight:600;font-family:inherit;flex-shrink:0;cursor:pointer;transition:.12s;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--navy);color:#fff}
.btn-ghost{background:#fff;color:var(--navy);border:1px solid #C9D3E0}
.btn-row{display:flex;gap:8px;margin-top:11px}.btn-row .btn{flex:1}
.req-card{background:#E6F1FB;border-radius:14px;padding:13px;margin-bottom:9px}
.req-flow{display:flex;align-items:center;gap:8px;margin:10px 0 3px}
.flow-ar{color:var(--ink-soft);display:flex}.flow-ar svg{width:16px;height:16px}

/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px}
.chip{padding:8px 14px;min-height:44px;display:inline-flex;align-items:center;border-radius:var(--pill);background:#fff;border:1px solid var(--line);font-size:12.5px;font-weight:600;color:var(--ink-mid);white-space:nowrap;flex-shrink:0}
.chip.on{background:var(--navy);border-color:var(--navy);color:#fff}

/* profile */
.prof-top{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;text-align:center;box-shadow:0 2px 8px rgba(10,35,66,.05)}
.prof-ava{width:74px;height:74px;border-radius:22px;margin:0 auto 14px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:30px;color:#fff}
.prof-name{font-size:19px;font-weight:700}.prof-role{font-size:13px;color:var(--ink-soft);margin-top:3px}
.prof-list{margin-top:14px}
.prof-row{display:flex;align-items:center;gap:13px;padding:15px;background:var(--card);border:1px solid var(--line);border-radius:14px;margin-bottom:10px}
.prof-row .ic{width:38px;height:38px;border-radius:11px;background:var(--canvas);display:flex;align-items:center;justify-content:center;color:var(--navy);flex-shrink:0}
.prof-row .ic svg{width:18px;height:18px}.prof-row .l{font-size:14px;font-weight:600}.prof-row .v{font-size:12px;color:var(--ink-soft)}
.prof-row .ar{margin-left:auto;color:var(--ink-soft)}
.logout{width:100%;margin-top:8px;padding:15px;border-radius:14px;background:var(--danger-bg);color:var(--danger);font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px}
.logout svg{width:19px;height:19px;flex-shrink:0}

/* ===== BOTTOM NAV ===== */
.tabbar{position:absolute;bottom:0;left:0;right:0;height:auto;min-height:76px;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-around;padding:0 8px calc(6px + env(safe-area-inset-bottom));z-index:20}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding-top:10px;color:var(--ink-soft);font-size:10.5px;font-weight:600}
.tab svg{width:23px;height:23px;stroke-width:2}
.tab.on{color:var(--navy)}
.fab{width:58px;height:58px;border-radius:20px;background:linear-gradient(135deg,var(--navy),var(--navy-mid));display:flex;align-items:center;justify-content:center;box-shadow:0 10px 24px rgba(21,57,110,.42);margin-top:-26px;flex-shrink:0}
.fab svg{width:27px;height:27px;color:#fff;stroke-width:2.6}
.fab:active{transform:scale(.94)}

/* ===== SHEET (bottom modal) ===== */
.sheet-bg{position:absolute;inset:0;background:rgba(7,24,46,.5);z-index:60;display:none;align-items:flex-end}
.sheet-bg.open{display:flex;animation:fade .2s}
.sheet-bg.center{align-items:center;justify-content:center;padding:20px}
.sheet-bg.center .sheet{width:100%;max-width:400px;max-height:86%;border-radius:24px;animation:pkpop .3s cubic-bezier(.16,1,.3,1)}
.sheet-bg.center .sheet-grip{display:none}
.sheet-bg.center .sheet-h{border-radius:24px 24px 0 0}
.sheet{background:#fff;width:100%;max-height:92%;border-radius:26px 26px 0 0;overflow-y:auto;animation:up .32s cubic-bezier(.16,1,.3,1)}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:2}
.sheet-h h3{font-size:17px;font-weight:700}
.sheet-h .x{width:34px;height:34px;border-radius:10px;background:var(--canvas);display:flex;align-items:center;justify-content:center;color:var(--ink-mid)}
.sheet-h .x svg{width:18px;height:18px}
.sheet-b{padding:18px 20px 28px}
.sheet-grip{width:40px;height:4px;border-radius:3px;background:#D5DEEC;margin:9px auto 0}

.pick{display:flex;align-items:center;gap:13px;padding:15px;border:1px solid var(--line);border-radius:14px;margin-bottom:10px;transition:.14s}
.pick:active{background:var(--canvas)}
.pick .ic{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.pick .ic svg{width:22px;height:22px;color:#fff}
.pick .t{font-size:15px;font-weight:600}.pick .s{font-size:12px;color:var(--ink-soft)}
.pick .ar{margin-left:auto;color:var(--ink-soft)}

.field{margin-bottom:15px}.field label{display:block;font-size:13px;font-weight:600;margin-bottom:7px}
.field input,.field select,.field textarea{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:var(--r-sm);font-size:16px;color:var(--ink);background:#fff;outline:none;transition:.16s}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--navy-soft);box-shadow:0 0 0 3px rgba(44,91,160,.12)}
.field textarea{resize:vertical;min-height:80px;line-height:1.6}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:8px}
.type-opt{padding:12px;border:1.5px solid var(--line);border-radius:12px;display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600;color:var(--ink-mid)}
.type-opt .sw{width:13px;height:13px;border-radius:4px;flex-shrink:0}
.type-opt.on{border-color:var(--navy);background:#F4F8FD;color:var(--ink)}
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid #EEF2F8}
.toggle-row .l{font-size:14px;font-weight:600}.toggle-row .s{font-size:11.5px;color:var(--ink-soft)}
.tg{width:46px;height:26px;border-radius:50px;background:#CBD5E6;position:relative;transition:.2s;flex-shrink:0}
.tg::after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;top:3px;left:3px;transition:.2s;box-shadow:0 2px 5px rgba(0,0,0,.2)}
.tg.on{background:var(--success)}.tg.on::after{left:23px}
.submit{width:100%;margin-top:14px;padding:16px;border-radius:14px;background:linear-gradient(135deg,var(--navy),var(--navy-mid));color:#fff;font-size:15.5px;font-weight:700;box-shadow:0 8px 20px rgba(21,57,110,.32);display:flex;align-items:center;justify-content:center;gap:8px}
.submit:active{transform:scale(.99)}
.submit svg{width:18px;height:18px;flex-shrink:0}

.empty{text-align:center;padding:40px 20px;color:var(--ink-soft)}
.empty svg{width:42px;height:42px;color:#C3CEE0;margin-bottom:12px}.empty h4{font-size:14px;color:var(--ink-mid);font-weight:600}.empty p{font-size:12.5px;margin-top:4px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:var(--navy-deep);color:#fff;padding:13px 22px;border-radius:14px;font-size:13.5px;font-weight:500;z-index:80;box-shadow:0 12px 30px rgba(0,0,0,.3);display:flex;align-items:center;gap:9px;opacity:0;transition:.3s;max-width:90%}
.toast svg{width:18px;height:18px;color:var(--success)}.toast.show{opacity:1}
.day-sheet-list{display:flex;flex-direction:column;gap:9px}
/* ===== Bilingual Date/Time Picker (mobile) ===== */
.dtf-btn{width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:14px;background:#fff;display:flex;align-items:center;gap:12px;text-align:left;font-family:inherit}
.dtf-btn:active{background:var(--canvas)}
.dtf-btn .dtf-ic{color:var(--navy-mid);flex-shrink:0;display:flex}
.dtf-btn .dtf-v{flex:1;min-width:0}
.dtf-btn .dtf-th{font-size:15px;font-weight:600;color:var(--ink);line-height:1.2}
.dtf-btn .dtf-en{font-size:11px;color:var(--ink-soft);font-weight:500;margin-top:2px}
.dtf-btn.empty .dtf-th{color:var(--ink-soft);font-weight:500}
.pk{position:absolute;inset:0;z-index:90;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(7,24,46,.55);backdrop-filter:blur(4px)}
.pk.open{display:flex}
.pk-card{background:#fff;border-radius:24px;width:100%;max-width:380px;box-shadow:0 30px 70px rgba(7,24,46,.5);overflow:hidden;animation:pkpop .3s cubic-bezier(.16,1,.3,1)}
@keyframes pkpop{from{opacity:0;transform:scale(.94) translateY(14px)}to{opacity:1;transform:none}}
.pk-head{background:linear-gradient(135deg,var(--navy-dark),var(--navy));color:#fff;padding:20px 22px;position:relative}
.pk-cap{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;opacity:.6;font-family:var(--mono)}
.pk-th{font-size:23px;font-weight:700;margin-top:5px;line-height:1.15}
.pk-en{font-size:12.5px;opacity:.72;margin-top:2px}
.pk-x{position:absolute;top:15px;right:15px;width:34px;height:34px;border-radius:11px;background:rgba(255,255,255,.14);display:flex;align-items:center;justify-content:center;color:#fff}
.pk-x svg{width:18px;height:18px}
.pk-body{padding:16px 18px 18px}
.pk-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.pk-nav button{width:42px;height:42px;border-radius:13px;background:var(--canvas);color:var(--navy);display:flex;align-items:center;justify-content:center}
.pk-nav button svg{width:20px;height:20px}
.pk-my{text-align:center;line-height:1.3}
.pk-my .m{font-size:17px;font-weight:700;color:var(--ink)}
.pk-my .m em{font-style:normal;color:var(--ink-soft);font-weight:500;font-size:13px}
.pk-my .y{font-size:11.5px;color:var(--ink-soft);font-weight:600}
.pk-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.pk-dow{text-align:center;font-size:11px;font-weight:700;color:var(--ink-soft);padding:7px 0}
.pk-dow.we{color:var(--yellow-dark)}
.pk-d{aspect-ratio:1;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;color:var(--ink);border:1.5px solid transparent}
.pk-d:active{background:var(--canvas)}
.pk-d.mut{color:#DDE4EF;pointer-events:none}
.pk-d.we{color:var(--navy-mid)}
.pk-d.today{border-color:var(--navy-soft)}
.pk-d.sel{background:linear-gradient(135deg,var(--navy),var(--navy-mid));color:#fff}
.pk-foot{display:flex;gap:10px;padding:0 18px 18px}
.pk-foot button{flex:1;padding:14px;border-radius:14px;font-weight:600;font-size:14px;font-family:inherit;line-height:1.25}
.pk-foot .today-btn{background:var(--canvas);color:var(--navy)}
.pk-foot .today-btn small,.pk-foot .ok-btn small{display:block;font-size:10px;font-weight:500;opacity:.7}
.pk-foot .ok-btn{background:linear-gradient(180deg,var(--navy),var(--navy-mid));color:#fff}
.tp-cols{display:flex;gap:12px;align-items:stretch}
.tp-col{flex:1;text-align:center}
.tp-col-h{font-size:11px;font-weight:700;color:var(--ink-soft);margin-bottom:8px}
.tp-col-h em{font-style:normal;font-weight:500}
.tp-scroll{height:200px;overflow-y:auto;border:1px solid var(--line);border-radius:16px;padding:6px;-webkit-overflow-scrolling:touch}
.tp-scroll::-webkit-scrollbar{width:0}
.tp-o{padding:11px;border-radius:11px;font-family:var(--mono);font-size:18px;font-weight:600;color:var(--ink-mid);margin-bottom:3px}
.tp-o.on{background:linear-gradient(135deg,var(--navy),var(--navy-mid));color:#fff}
.tp-sep{display:flex;align-items:center;font-size:26px;font-weight:700;color:var(--ink-soft);font-family:var(--mono)}
.tp-quick{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px}
.tp-quick button{flex:1;min-width:62px;padding:9px 6px;border-radius:11px;background:var(--canvas);color:var(--navy);font-size:12.5px;font-weight:600;font-family:inherit;line-height:1.3}
.tp-quick button small{display:block;font-size:9px;opacity:.7;font-weight:500}
.savepop{position:absolute;inset:0;z-index:120;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(7,24,46,.55);backdrop-filter:blur(4px)}
.savepop.open{display:flex}
.savepop-card{background:#fff;border-radius:24px;width:100%;max-width:320px;padding:32px 26px;text-align:center;box-shadow:0 30px 70px rgba(7,24,46,.5);animation:pkpop .3s cubic-bezier(.16,1,.3,1)}
.savepop-ic{width:72px;height:72px;border-radius:50%;margin:0 auto 16px;display:flex;align-items:center;justify-content:center}
.savepop-ic svg{width:36px;height:36px}
.savepop.saving .savepop-ic{background:var(--canvas)}
.savepop.ok .savepop-ic{background:var(--success-bg);color:#0B7A55}
.savepop.err .savepop-ic{background:var(--danger-bg);color:#C0392B}
.savepop-spin{width:40px;height:40px;border:4px solid var(--line);border-top-color:var(--navy);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.savepop-th{font-size:18px;font-weight:700;color:var(--ink)}
.savepop-en{font-size:12px;color:var(--ink-soft);margin-top:4px}
.savepop-sub{font-size:13px;color:var(--ink-mid);margin-top:10px;line-height:1.5}
.savepop-btn{margin-top:18px;padding:13px 26px;border-radius:14px;background:var(--navy);color:#fff;font-weight:600;font-size:14px;font-family:inherit;width:100%}
</style>
</head>

async function doLogin(){

    try{
      const win=defaultWindow();

function bioSupported(){return !!(window.PublicKeyCredential&&navigator.credentials&&location.protocol==='https:');}
function bioGet(){try{return JSON.parse(localStorage.getItem(BIO_KEY)||'null');}catch(e){return null;}}
function _b64toBuf(b){b=String(b).replace(/-/g,'+').replace(/_/g,'/');const s=atob(b);const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u.buffer;}
function _bufToB64(buf){const u=new Uint8Array(buf);let s='';for(let i=0;i<u.length;i++)s+=String.fromCharCode(u[i]);return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function initBioBtn(){const b=document.getElementById('lg-bio');if(b)b.style.display=(bioSupported()&&bioGet())?'flex':'none';}

async function enableBio(){
  if(!bioSupported()){toast('อุปกรณ์/เบราว์เซอร์นี้ไม่รองรับลายนิ้วมือ','err');return;}
  if(!CUR||!CUR.user){toast('กรุณาเข้าสู่ระบบก่อน','err');return;}
  try{
    const ch=new Uint8Array(32);crypto.getRandomValues(ch);
    const uid=new TextEncoder().encode(String(CUR.id||CUR.user));
    const cred=await navigator.credentials.create({publicKey:{
      challenge:ch,rp:{name:'GNR3 Team Plans'},user:{id:uid,name:CUR.user,displayName:CUR.name||CUR.user},
      pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
      authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required'},timeout:60000,attestation:'none'}});
    if(!cred){toast('ยกเลิกการเปิดใช้','err');return;}

async function bioLogin(){
  const b=bioGet();if(!b){toast('ยังไม่ได้เปิดลายนิ้วมือบนเครื่องนี้','err');return;}
  if(!bioSupported()){toast('อุปกรณ์นี้ไม่รองรับ','err');return;}
  try{
    const ch=new Uint8Array(32);crypto.getRandomValues(ch);
    const asrt=await navigator.credentials.get({publicKey:{challenge:ch,allowCredentials:[{type:'public-key',id:_b64toBuf(b.credId)}],userVerification:'required',timeout:60000}});
    if(!asrt){toast('สแกนไม่สำเร็จ','err');return;}
    document.getElementById('lg-user').value=b.user;document.getElementById('lg-pass').value=b.pass;doLogin();
  }catch(e){toast('สแกนไม่สำเร็จ หรือถูกยกเลิก','err');}
}

const CACHE_KEY='gnr3_cache_v1';

const _mk=(y,m)=>y+'-'+pad(m+1);
function monthWindow(y,m){const last=new Date(y,m+1,0).getDate();return {from:_mk(y,m)+'-01',to:_mk(y,m)+'-'+pad(last),months:[_mk(y,m)]};}
function defaultWindow(){const y=NOW.getFullYear(),m=NOW.getMonth();const a=new Date(y,m-2,1),b=new Date(y,m+3,0);const months=[];for(let i=-2;i<=2;i++){const d=new Date(y,m+i,1);months.push(_mk(d.getFullYear(),d.getMonth()));}return {from:a.getFullYear()+'-'+pad(a.getMonth()+1)+'-'+pad(a.getDate()),to:b.getFullYear()+'-'+pad(b.getMonth()+1)+'-'+pad(b.getDate()),months};}
function hydrateCache(){try{const c=JSON.parse(localStorage.getItem(CACHE_KEY)||'null');if(!c||c.cur!==CUR.id||!Array.isArray(c.records))return false;if(Array.isArray(c.employees)&&c.employees.length)employees=c.employees;records=c.records;if(Array.isArray(c.holidays))holidays=c.holidays;if(Array.isArray(c.tasks)&&c.tasks.length)TASKS=c.tasks;if(Array.isArray(c.builds)&&c.builds.length)BUILDINGS=c.builds;loadedMonths=new Set(c.months||[]);return true;}catch(e){return false;}}

function applyData(d,win){
  const D=v=>{if(v==null||v==='')return '';v=''+v;if(v.indexOf('T')>0&&(v.slice(-1)==='Z'||/[+-]\d{2}:\d{2}$/.test(v))){const dt=new Date(v);return new Date(dt.getTime()+7*3600*1000).toISOString().slice(0,10);}return v.slice(0,10);};
  const S=v=>v==null?'':String(v).trim();
  if(Array.isArray(d.employees)) employees=d.employees.map(e=>({id:S(e.emp_id),name:S(e.full_name),nick:S(e.nickname),dept:S(e.dept),pos:S(e.position),role:S(e.role).toLowerCase()||'user',user:S(e.username),pass:S(e.password_hash),photo:S(e.photo)}));
  if(Array.isArray(d.records)){
    const nr=d.records.map(r=>({id:S(r.record_id),emp:S(r.emp_id),cat:S(r.category).toLowerCase(),start:D(r.start_date),end:D(r.end_date||r.start_date),title:S(r.title),location:S(r.location),st:S(r.start_time),et:S(r.end_time),status:S(r.status).toLowerCase()||'none',overnight:r.overnight===true||S(r.overnight).toUpperCase()==='TRUE',cost:(r.cost===''||r.cost==null||isNaN(Number(r.cost)))?null:Number(r.cost),note:S(r.note),pendingEmp:S(r.pending_emp_id),reqBy:S(r.req_by)})).filter(r=>CAT[r.cat]&&r.start);
    if(win){const from=win.from,to=win.to;const keep=records.filter(r=>r.emp!==CUR.id&&(r.start<from||r.start>to));const map={};[...nr,...keep].forEach(r=>{if(!map[r.id])map[r.id]=r;});records=Object.values(map);}
    else records=nr;
  }
  if(Array.isArray(d.holidays)) holidays=d.holidays.map(h=>({date:D(h.date),name:S(h.name),type:S(h.type)||'public'}));
  if(Array.isArray(d.taskTypes)){const tt=d.taskTypes.filter(t=>t.active!==false&&String(t.active).toLowerCase()!=='false'&&S(t.th)).sort((a,b)=>(+a.sort||999)-(+b.sort||999)).map(t=>({id:S(t.task_id),th:S(t.th),en:S(t.en)}));if(tt.length){tt.push({th:'อื่นๆ',en:'Other'});TASKS=tt;}}
  if(Array.isArray(d.buildings)){const bd=d.buildings.filter(b=>b.active!==false&&String(b.active).toLowerCase()!=='false'&&S(b.name)).sort((a,b)=>(+a.sort||999)-(+b.sort||999)).map(b=>S(b.name));if(bd.length){bd.push('อื่นๆ');BUILDINGS=bd;}}
  const meNow=employees.find(e=>e.id===CUR.id);
  if(meNow){CUR.name=meNow.name||CUR.name;CUR.dept=meNow.dept;CUR.pos=meNow.pos;CUR.role=meNow.role||CUR.role;CUR.photo=meNow.photo||CUR.photo||'';
    setAva('ab-ava',CUR);const nEl=document.getElementById('ab-name');if(nEl)nEl.textContent=CUR.name?CUR.name.split(' ')[0]:CUR.user;
    const rEl=document.getElementById('ab-role');if(rEl)rEl.textContent=(({user:'ผู้ใช้งาน',approver:'ผู้อนุมัติ',admin:'ผู้ดูแลระบบ'})[CUR.role]||'ผู้ใช้งาน')+(CUR.dept?' • '+CUR.dept:'');}
}

function tcToggleMulti(){tcMulti=!tcMulti;tcSel=[];renderTaskCal();}
function tcTapDay(ds){if(tcMulti){const i=tcSel.indexOf(ds);if(i>=0)tcSel.splice(i,1);else tcSel.push(ds);renderTaskCal();}else{openTaskForm([ds]);}}
function tcAddSelected(){if(!tcSel.length){toast('ยังไม่ได้เลือกวัน','err');return;}openTaskForm(tcSel.slice().sort());}
function renderTaskCal(){
  const wrap=document.getElementById('tc-wrap');if(!wrap)return;
  const dim=daysIn(tcY,tcM),first=new Date(tcY,tcM,1).getDay();
  let cells=DOW_TH.map(d=>`<div class="cal-dow">${d}</div>`).join('');
  for(let i=0;i<first;i++)cells+=`<div class="cal-c muted"></div>`;
  for(let d=1;d<=dim;d++){const ds=tcY+'-'+pad(tcM+1)+'-'+pad(d);
    const tks=records.filter(r=>r.cat==='task'&&r.start<=ds&&ds<=r.end);
    const dow=new Date(tcY,tcM,d).getDay(),hol=holiName(ds),isToday=ds===TODAY,picked=tcSel.indexOf(ds)>=0;
    const cls=['cal-c'];if(picked)cls.push('pick');else if(isToday)cls.push('today');if((dow===0||dow===6)&&!picked)cls.push('we');if(hol&&!picked&&!isToday)cls.push('holi');
    let style='',badge='';
    if(tks.length&&!picked){if(!isToday&&!hol)style=` style="background:#7C3AED1F"`;badge=`<span class="cnt" style="color:${isToday?'#fff':'#7C3AED'}">${tks.length}</span>`;}
    cells+=`<div class="${cls.join(' ')}"${style} onclick="tcTapDay('${ds}')">${d}${badge}</div>`;}

    <div class="toggle-row" style="margin-top:14px"><div><div class="l">เลือกหลายวัน</div><div class="s">แตะเลือกได้มากกว่า 1 วัน</div></div><div class="tg ${tcMulti?'on':''}" onclick="tcToggleMulti()"></div></div>

      <div class="cal-h"><div class="t">${THAI_M[tcM]} ${be(tcY)}<div class="en">${EN_M[tcM]} ${tcY}</div></div><div style="display:flex;gap:8px"><button onclick="tcStep(-1)">${I.chevL}</button><button onclick="tcStep(1)">${I.chevR}</button></div></div>

      <div class="cal-legend"><span><i style="background:#7C3AED"></i>งานที่มีอยู่</span></div>
    </div>
    <div style="font-size:12px;color:var(--ink-soft);text-align:center;margin-top:12px">${tcMulti?(tcSel.length?`เลือกแล้ว ${tcSel.length} วัน`:'แตะวันเพื่อเลือก (เลือกได้หลายวัน)'):'แตะวันเพื่อเพิ่มงานในวันนั้น'}</div>
    ${tcMulti&&tcSel.length?`<button class="submit" onclick="tcAddSelected()">${I.check} เพิ่มงานใน ${tcSel.length} วันที่เลือก</button>`:''}`;

function openTaskForm(dates){
  const multi=Array.isArray(dates);
  const dayBlock=multi
    ?`<div class="field"><label>วันที่เลือก (${dates.length} วัน)</label><div class="daychips">${dates.slice().sort().map(ds=>`<span class="daychip">${+ds.slice(8,10)} ${THAI_MS[(+ds.slice(5,7))-1]}</span>`).join('')}</div></div>`
    :`<div class="row2"><div class="field"><label>วันที่เริ่ม</label>${dateField('tf-start',TODAY)}</div><div class="field"><label>ถึงวันที่</label>${dateField('tf-end',TODAY)}</div></div>`;
  const datesArg=multi?JSON.stringify(dates).replace(/"/g,"'"):'null';
  openSheet(multi?`เพิ่มงาน · ${dates.length} วัน`:'เพิ่มงาน',`

    <div class="field hidden" id="tf-build-c"><label>ระบุอาคาร</label><input id="tf-build-o" placeholder="ชื่ออาคาร/สถานที่"></div>

    <div class="field"><label>ผู้รับผิดชอบ</label><select id="tf-emp"><option value="">— เปิดงานไว้ (ให้กดรับเอง) —</option>${employees.filter(e=>!isInactive(e)).map(e=>`<option value="${e.id}">${esc(e.nick?e.nick+' ('+e.name+')':e.name)}</option>`).join('')}</select></div>
    ${dayBlock}
    <div class="field"><label>รายละเอียด</label><textarea id="tf-note" placeholder="หมายเหตุ"></textarea></div>
    <button class="submit" onclick="submitTaskForm(${datesArg})">${I.check} ${multi?'เพิ่มงาน '+dates.length+' วัน':'บันทึกงาน'}</button>`,true);

function tfBuildToggle(){const c=document.getElementById('tf-build-c');if(c)c.classList.toggle('hidden',fv('tf-build')!=='อื่นๆ');}
function tfTypeToggle(){const c=document.getElementById('tf-type-c');if(c)c.classList.toggle('hidden',TASKS[+fv('tf-type')].th!=='อื่นๆ');}
function submitTaskForm(dates){
  let build=fv('tf-build');if(build==='อื่นๆ')build=(fv('tf-build-o')||'').trim()||'อื่นๆ';
  const ti=+fv('tf-type');const title=TASKS[ti].th==='อื่นๆ'?((fv('tf-type-o')||'').trim()||'อื่นๆ'):(TASKS[ti].th+' / '+TASKS[ti].en);
  const empId=fv('tf-emp'),note=fv('tf-note');
  if(!Array.isArray(dates)){const s=fv('tf-start'),e=fv('tf-end');if(!s){toast('กรุณาเลือกวันที่','err');return;}
    saveRecordM({action:'createRecord',emp_id:empId,category:'task',title,location:build,start_date:s,end_date:e||s,note,actor:CUR.id},
      R(empId,'task',s,e||s,{title,location:build,note,status:empId?'none':'open'}));return;}
  const days=[...new Set(dates)].sort();
  if(!days.length){toast('ยังไม่ได้เลือกวัน','err');return;}
  const items=days.map(ds=>({payload:{action:'createRecord',emp_id:empId,category:'task',title,location:build,start_date:ds,end_date:ds,note,actor:CUR.id},
    local:R(empId,'task',ds,ds,{title,location:build,note,status:empId?'none':'open'})}));
  saveManyRecordsM(items);
}
async function saveManyRecordsM(items){
  items.forEach(it=>records.unshift(it.local));closeSheet();nav(curScr);
  if(!CONFIG.SHEETS_API_URL){toast('บันทึกแล้ว '+items.length+' วัน');return;}
  showSavingM();let ok=0,fail=0,lastErr='';
  for(const it of items){
    try{const res=await fetch(CONFIG.SHEETS_API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(it.payload)});
      const j=await res.json();
      if(j&&j.ok){ok++;const dd=j.data||{};if(dd.record_id)it.local.id=String(dd.record_id);if(dd.status)it.local.status=String(dd.status).toLowerCase();}
      else{fail++;lastErr=(j&&/category/i.test(j.error||''))?'ต้อง deploy โค้ด Apps Script ใหม่ก่อน':((j&&j.error)||'ฐานข้อมูลไม่ตอบสนอง');}
    }catch(e){fail++;lastErr='เชื่อมต่อฐานข้อมูลไม่ได้';}
  }
  nav(curScr);
  if(fail===0)showSavedM(true);else showSavedM(false,`สำเร็จ ${ok}/${items.length} วัน • ${lastErr}`);
}

function setCalView(v){calView=v;paintCal();}

const toMin=t=>{const p=String(t||'0:0').split(':');return (+p[0]||0)*60+(+p[1]||0);};
function weekDays(ds){const d=parse(ds);const sun=new Date(d);sun.setDate(d.getDate()-d.getDay());const out=[];for(let i=0;i<7;i++){const x=new Date(sun);x.setDate(sun.getDate()+i);out.push(x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate()));}return out;}
function weekLabel(wk){const a=parse(wk[0]),b=parse(wk[6]);return a.getMonth()===b.getMonth()?`${a.getDate()}–${b.getDate()} ${THAI_MS[b.getMonth()]} ${be(b.getFullYear())}`:`${a.getDate()} ${THAI_MS[a.getMonth()]} – ${b.getDate()} ${THAI_MS[b.getMonth()]} ${be(b.getFullYear())}`;}
function weekStep(dir){const d=parse(selDate);d.setDate(d.getDate()+dir*7);selDate=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());calY=d.getFullYear();calM=d.getMonth();paintCal();ensureMonth(calY,calM);}
function packCols(items){
  const res=items.map(()=>({col:0,cols:1}));
  const iv=items.map((r,i)=>({i,s:toMin(r.st),e:Math.max(toMin(r.st)+30,r.et&&toMin(r.et)>toMin(r.st)?toMin(r.et):toMin(r.st)+60)}));
  const order=[...iv].sort((a,b)=>a.s-b.s||a.e-b.e);
  let cluster=[],colEnds=[],cMax=-1;
  function flush(){const cols=colEnds.length||1;cluster.forEach(x=>{res[x.i].col=x.col;res[x.i].cols=cols;});cluster=[];colEnds=[];cMax=-1;}
  order.forEach(it=>{if(cluster.length&&it.s>=cMax)flush();let col=colEnds.findIndex(e=>e<=it.s);if(col===-1){col=colEnds.length;colEnds.push(it.e);}else colEnds[col]=it.e;it.col=col;cluster.push(it);cMax=Math.max(cMax,it.e);});
  flush();return res;
}
function timelineHTML(items){
  if(!items.length)return `<div class="card">${emptyHTML('ไม่มีงานที่มีช่วงเวลาในวันนี้')}</div>`;
  const HP=46;let minH=8,maxH=18;
  items.forEach(r=>{const s=toMin(r.st),e=(r.et&&toMin(r.et)>toMin(r.st))?toMin(r.et):s+60;minH=Math.min(minH,Math.floor(s/60));maxH=Math.max(maxH,Math.ceil(e/60));});
  minH=Math.max(0,minH);maxH=Math.min(24,Math.max(maxH,minH+2));
  const lay=packCols(items),H=(maxH-minH)*HP;
  let grid='';for(let h=minH;h<=maxH;h++){const top=(h-minH)*HP;grid+=`<div class="tl-line" style="top:${top}px"></div><div class="tl-hr" style="top:${top-6}px">${pad(h)}:00</div>`;}
  let blocks='';
  items.forEach((r,i)=>{const s=toMin(r.st),e0=(r.et&&toMin(r.et)>toMin(r.st))?toMin(r.et):s+60;const top=(s/60-minH)*HP,ht=Math.max(40,(e0-s)/60*HP-6);const c=CATX(r),L=lay[i],w=100/L.cols,left=L.col*w;
    blocks+=`<div class="tl-block" style="top:${top}px;height:${ht}px;left:calc(${left}% + 4px);width:calc(${w}% - 8px);background:${c.c}1F" onclick="openRec('${r.id}')">
      <div style="min-width:0"><div class="tl-t" style="color:${c.c}">${c.th}${r.cat==='task'&&r.title?' · '+esc(r.title):''}</div><div class="tl-s">${r.emp?esc(dispName(r.emp)):'งานว่าง'}${r.location?' · '+esc(r.location):''}</div></div>
      <span class="tl-pill" style="color:${c.c};background:${c.c}30">${r.st}${r.et?'–'+r.et:''}</span>
    </div>`;});
  return `<div class="tl-wrap" style="height:${H}px">${grid}<div class="tl-lane">${blocks}</div></div>`;
}
function weekFragment(){
  const wk=weekDays(selDate),dayRecs=calRecOn(selDate);
  const allday=dayRecs.filter(r=>!r.st),timed=dayRecs.filter(r=>r.st).sort((a,b)=>toMin(a.st)-toMin(b.st));
  const strip=DOW_TH.map((d,i)=>{const ds=wk[i],rc=calRecOn(ds),sel=ds===selDate,dd=+ds.slice(8,10);
    return `<div onclick="selDate='${ds}';paintCal()"><div style="font-size:10px;color:var(--ink-soft);margin-bottom:5px">${d}</div><div class="wk-day${sel?' on':''}">${dd}</div><div style="height:6px;margin-top:3px">${rc.length&&!sel?`<span class="wk-dot" style="background:${CATX(rc[0]).c}"></span>`:''}</div></div>`;}).join('');
  const alldayHTML=allday.length?`<div class="grp-h" style="margin-top:2px">ทั้งวัน</div><div class="allday-row">${allday.map(r=>{const c=CATX(r);return `<div class="ad-chip" style="background:${c.c}1F" onclick="openRec('${r.id}')">${avatarHTML(r.emp,22)}<div style="min-width:0"><div class="ad-t" style="color:${c.c}">${c.th}</div><div class="ad-s">${r.emp?esc(dispName(r.emp)):'งานว่าง'}</div></div></div>`;}).join('')}</div>`:'';
  return `
  <div class="card cal-card" style="padding:14px 12px">
    <div class="cal-h" style="margin-bottom:12px"><div class="t">${weekLabel(wk)}</div><div style="display:flex;gap:8px"><button onclick="weekStep(-1)">${I.chevL}</button><button onclick="weekStep(1)">${I.chevR}</button></div></div>
    <div class="wk-strip">${strip}</div>
  </div>
  ${alldayHTML}
  <div class="sec-h"><h3>${selDate===TODAY?'วันนี้':fmtTH(selDate)}</h3></div>
  ${timelineHTML(timed)}`;
}
function calStep(d){calM+=d;if(calM>11){calM=0;calY++;}if(calM<0){calM=11;calY--;}paintCal();ensureMonth(calY,calM);}

async function cancelReq(id){

async function saveTaskType(id){
  const th=(fv('tt-th')||'').trim(),en=(fv('tt-en')||'').trim();
  if(!th){toast('กรุณากรอกชื่อ (ไทย)','err');return;}
  const other=TASKS.find(t=>t.th==='อื่นๆ'),list=TASKS.filter(t=>t.th!=='อื่นๆ');
  if(id){const t=list.find(x=>x.id===id);if(t){t.th=th;t.en=en;}} else list.push({id:'',th,en});
  TASKS=other?list.concat([other]):list; saveCache(); openTaskTypeMgr(); toast('บันทึกแล้ว');

    if(j&&j.ok&&j.data&&j.data.task_id){if(!id){const nt=TASKS.find(t=>t.th===th&&!t.id);if(nt)nt.id=String(j.data.task_id);saveCache();}}
    else toast((j&&j.error)||'บันทึกฝั่งเซิร์ฟเวอร์ไม่สำเร็จ (ต้อง deploy .gs ใหม่)','err');
  }catch(e){toast('บันทึกในเครื่องไว้ชั่วคราว','warn');}
}
async function deleteTaskTypeM(id){

}

}
function closeSheet(){document.getElementById('sheet-bg').classList.remove('open');}
document.getElementById('sheet-bg').addEventListener('click',e=>{if(e.target.id==='sheet-bg')closeSheet();});

function openPicker(){
  openSheet('แจ้งรายการใหม่',`
    ${pick('leave','#15396E',I.cal,'แจ้งลา','ป่วย / กิจ / อื่นๆ / พักร้อน')}
    ${pick('training','#0EA5E9',I.cap,'อบรม / กิจกรรม','อบรมภายใน / ESV / กิจกรรม')}
    ${pick('overtime','#F97316',I.bolt,'ทำงานล่วงเวลา (OT)','บันทึก OT')}
    ${pick('offsite','#14B8A6',I.pin,'งานนอกสถานที่','ค้างคืน / ค่าใช้จ่าย')}
    ${pick('task','#7C3AED',I.check,'มอบหมายงาน','Task Assignment • ไม่ต้องอนุมัติ','openTaskCal()')}`);
}
function pick(type,c,icon,t,s,action){return `<button class="pick" style="width:100%;text-align:left" onclick="${action||`openForm('${type}')`}"><div class="ic" style="background:${c}">${icon}</div><div><div class="t">${t}</div><div class="s">${s}</div></div><div class="ar">${I.ar}</div></button>`;}

let formType='sick';
function openForm(group){
  const today=TODAY;
  if(group==='leave'){formType='sick';
    openSheet('แจ้งลา',`
      <div class="field"><label>ประเภทการลา</label><div class="type-grid" id="type-grid">
        ${['sick','personal','other','vacation'].map(k=>typeOpt(k)).join('')}</div></div>
      <div class="row2"><div class="field"><label>วันที่เริ่ม</label>${dateField('f-start',today)}</div><div class="field"><label>ถึงวันที่</label>${dateField('f-end',today)}</div></div>
      <div class="field"><label>เหตุผล</label><textarea id="f-note" placeholder="ระบุเหตุผล"></textarea></div>
      ${submitBtn('submitLeave()')}`);
  } else if(group==='training'){formType='internal';
    openSheet('อบรม / กิจกรรม',`
      <div class="field"><label>ประเภท</label><div class="type-grid" id="type-grid">${['internal','esv','event'].map(k=>typeOpt(k)).join('')}</div></div>
      <div class="field"><label>ชื่อหัวข้อ / กิจกรรม</label><input id="f-title" placeholder="เช่น อบรม Security ภายใน"></div>
      <div class="field"><label>สถานที่</label><input id="f-loc" placeholder="เช่น ห้องประชุม A / ศูนย์ ESV"></div>
      <div class="row2"><div class="field"><label>วันที่เริ่ม</label>${dateField('f-start',today)}</div><div class="field"><label>ถึงวันที่</label>${dateField('f-end',today)}</div></div>
      <div class="row2"><div class="field"><label>เวลาเริ่ม</label>${timeField('f-st','')}</div><div class="field"><label>เวลาสิ้นสุด</label>${timeField('f-et','')}</div></div>
      ${submitBtn('submitTrain()')}`);
  } else if(group==='task'){formType='task';
    openSheet('มอบหมายงาน (Task Assignment)',`
      <div class="field"><label>อาคาร</label><select id="t-build" onchange="taskBuildToggleM()">${BUILDINGS.map(b=>`<option value="${b}">${b}</option>`).join('')}</select></div>
      <div class="field hidden" id="t-build-custom"><label>ระบุอาคาร (อื่นๆ)</label><input id="t-build-other" placeholder="ชื่ออาคาร/สถานที่"></div>
      <div class="field"><label>ประเภทงาน</label><select id="t-type" onchange="taskTypeToggleM()">${TASKS.map((t,i)=>`<option value="${i}">${t.th} / ${t.en}</option>`).join('')}</select></div>
      <div class="field hidden" id="t-type-custom"><label>ระบุประเภทงาน (อื่นๆ)</label><input id="t-type-other" placeholder="ระบุงานที่มอบหมาย"></div>
      <div class="row2"><div class="field"><label>วันที่เริ่ม</label>${dateField('f-start',today)}</div><div class="field"><label>ถึงวันที่</label>${dateField('f-end',today)}</div></div>
      <div class="field"><label>รายละเอียดเพิ่มเติม</label><textarea id="f-note" placeholder="รายละเอียดงาน / ผู้ประสานงาน / หมายเหตุ"></textarea></div>
      ${submitBtn('submitTask()')}`);
  } else { // overtime or offsite
    formType=group;
    openSheet(group==='overtime'?'ทำงานล่วงเวลา (OT)':'งานนอกสถานที่',`
      <div class="field"><label>ประเภท</label><div class="type-grid" id="type-grid">${['overtime','offsite'].map(k=>typeOpt(k,'otToggle')).join('')}</div></div>
      <div class="field"><label>ชื่องาน</label><input id="f-title" placeholder="เช่น ปิดยอดสิ้นเดือน"></div>
      <div class="field"><label>สถานที่</label><input id="f-loc" placeholder="เช่น สำนักงาน / ชลบุรี"></div>
      <div class="row2"><div class="field"><label>วันที่เริ่ม</label>${dateField('f-start',today)}</div><div class="field"><label>ถึงวันที่</label>${dateField('f-end',today)}</div></div>
      <div class="row2"><div class="field"><label>เวลาเริ่ม</label>${timeField('f-st','')}</div><div class="field"><label>เวลาสิ้นสุด</label>${timeField('f-et','')}</div></div>
      <div id="offsite-extra" class="${group==='offsite'?'':'hidden'}">
        <div class="toggle-row"><div><div class="l">ค้างคืน</div><div class="s">ค้างคืนนอกสถานที่</div></div><div class="tg" id="f-overnight" onclick="this.classList.toggle('on')"></div></div>
        <div class="toggle-row"><div><div class="l">มีค่าใช้จ่าย</div><div class="s">เปิดเพื่อกรอกจำนวนเงิน</div></div><div class="tg" id="f-hascost" onclick="this.classList.toggle('on');document.getElementById('cost-wrap').classList.toggle('hidden',!this.classList.contains('on'))"></div></div>
        <div class="field hidden" id="cost-wrap" style="margin-top:12px"><label>จำนวนเงิน (บาท)</label><input type="number" id="f-cost" class="mono" placeholder="0"></div>
      </div>
      ${submitBtn('submitOT()')}`);
  }
}
function typeOpt(k,cb){return `<button class="type-opt ${k===formType?'on':''}" data-k="${k}" onclick="setType('${k}'${cb?",'"+cb+"'":''})"><span class="sw" style="background:${CAT[k].c}"></span>${CAT[k].th}</button>`;}
function setType(k,cb){formType=k;document.querySelectorAll('#type-grid .type-opt').forEach(o=>o.classList.toggle('on',o.dataset.k===k));if(cb==='otToggle')otToggle();}
function otToggle(){const ex=document.getElementById('offsite-extra');if(ex)ex.classList.toggle('hidden',formType!=='offsite');}
function submitBtn(fn){return `<button class="submit" onclick="${fn}">${I.check} ส่งรายการ</button>`;}
const fv=id=>{const e=document.getElementById(id);return e?e.value:'';};

function taskBuildToggleM(){const c=document.getElementById('t-build-custom');if(c)c.classList.toggle('hidden',fv('t-build')!=='อื่นๆ');}
function taskTypeToggleM(){const c=document.getElementById('t-type-custom');if(c)c.classList.toggle('hidden',TASKS[+fv('t-type')].th!=='อื่นๆ');}
async function submitTask(){
  let build=fv('t-build'); if(build==='อื่นๆ')build=(fv('t-build-other')||'').trim()||'อื่นๆ';
  const ti=+fv('t-type'); const title=TASKS[ti].th==='อื่นๆ'?((fv('t-type-other')||'').trim()||'อื่นๆ'):(TASKS[ti].th+' / '+TASKS[ti].en);
  const start=fv('f-start'),end=fv('f-end'),note=fv('f-note');
  if(!start){toast('กรุณาเลือกวันที่','err');return;}
  records.unshift(R(CUR.id,'task',start,end,{title,location:build,note,status:'none'}));
  closeSheet();nav(curScr);
  if(CONFIG.SHEETS_API_URL){
    try{
      const res=await fetch(CONFIG.SHEETS_API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
        body:JSON.stringify({action:'createRecord',emp_id:CUR.id,category:'task',title,location:build,start_date:start,end_date:end,note,actor:CUR.id})});
      const j=await res.json();
      if(j&&j.ok)toast('มอบหมายงานและบันทึกลงระบบแล้ว');
      else if(j&&/category/i.test(j.error||''))toast('บันทึกไม่สำเร็จ • ต้องอัปเดต (deploy) โค้ดฐานข้อมูลก่อน','err');
      else toast('บันทึกลงระบบไม่สำเร็จ • '+((j&&j.error)||'ลองใหม่อีกครั้ง'),'err');
    }catch(e){toast('ออฟไลน์ • ยังไม่ได้บันทึกลงระบบ','err');}
  }else toast('มอบหมายงานแล้ว');
}
function showSavingM(){document.getElementById('savepop').className='savepop open saving';
  document.getElementById('savepop-card').innerHTML=`<div class="savepop-ic"><div class="savepop-spin"></div></div><div class="savepop-th">กำลังบันทึก...</div><div class="savepop-en">Saving to Google Sheet</div><div class="savepop-sub">กรุณารอสักครู่</div>`;}
function showSavedM(ok,msg){const el=document.getElementById('savepop-card');
  if(ok){document.getElementById('savepop').className='savepop open ok';
    el.innerHTML=`<div class="savepop-ic">${I.check}</div><div class="savepop-th">บันทึกในระบบเรียบร้อย</div><div class="savepop-en">Saved to Google Sheet</div>`;
    setTimeout(closeSavePop,1600);
  }else{document.getElementById('savepop').className='savepop open err';
    el.innerHTML=`<div class="savepop-ic">${I.x}</div><div class="savepop-th">บันทึกไม่สำเร็จ</div><div class="savepop-en">Not saved</div><div class="savepop-sub">${esc(msg||'ลองใหม่อีกครั้ง')}</div><button class="savepop-btn" onclick="closeSavePop()">ปิด</button>`;}}
function closeSavePop(){document.getElementById('savepop').classList.remove('open');}
async function saveRecordM(payload,localRec){
  records.unshift(localRec); closeSheet(); nav(curScr);
  if(!CONFIG.SHEETS_API_URL){toast('บันทึกแล้ว');return;}
  showSavingM();
  try{const res=await fetch(CONFIG.SHEETS_API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
    const j=await res.json();
    if(j&&j.ok){const dd=j.data||{};if(dd.record_id)localRec.id=String(dd.record_id);if(dd.status)localRec.status=String(dd.status).toLowerCase();nav(curScr);showSavedM(true);}
    else if(j&&/category/i.test(j.error||''))showSavedM(false,'ต้อง deploy โค้ด Apps Script ใหม่ก่อน');
    else showSavedM(false,(j&&j.error)||'ฐานข้อมูลไม่ตอบสนอง');
  }catch(e){showSavedM(false,'เชื่อมต่อฐานข้อมูลไม่ได้');}
}
function submitLeave(){const cat=formType,start=fv('f-start'),end=fv('f-end'),note=fv('f-note');
  if(!start){toast('กรุณาเลือกวันที่','err');return;}
  saveRecordM({action:'createRecord',emp_id:CUR.id,category:cat,start_date:start,end_date:end,note,actor:CUR.id},
    R(CUR.id,cat,start,end,{note,status:CAT[cat].approve?'pending':'none'}));}
function submitTrain(){const cat=formType,start=fv('f-start'),end=fv('f-end'),title=fv('f-title')||CAT[cat].th,loc=fv('f-loc'),st=fv('f-st'),et=fv('f-et');
  if(!start){toast('กรุณาเลือกวันที่','err');return;}
  saveRecordM({action:'createRecord',emp_id:CUR.id,category:cat,title,location:loc,start_date:start,end_date:end,start_time:st,end_time:et,actor:CUR.id},
    R(CUR.id,cat,start,end,{title,location:loc,st,et,status:CAT[cat].approve?'pending':'none'}));}
function submitOT(){const cat=formType;const off=cat==='offsite';
  const overnight=off&&document.getElementById('f-overnight').classList.contains('on');
  const hasCost=off&&document.getElementById('f-hascost').classList.contains('on');
  const start=fv('f-start'),end=fv('f-end'),title=fv('f-title')||CAT[cat].th,loc=fv('f-loc'),st=fv('f-st'),et=fv('f-et');
  const cost=hasCost?Number(fv('f-cost')||0):null;
  if(!start){toast('กรุณาเลือกวันที่','err');return;}
  saveRecordM({action:'createRecord',emp_id:CUR.id,category:cat,title,location:loc,start_date:start,end_date:end,start_time:st,end_time:et,overnight,cost:cost==null?'':cost,actor:CUR.id},
    R(CUR.id,cat,start,end,{title,location:loc,st,et,overnight,cost,status:'pending'}));}

function openHolidays(){
  const sorted=[...holidays].sort((a,b)=>a.date<b.date?-1:1); const byM={};
  sorted.forEach(h=>{const m=h.date.slice(0,7);(byM[m]=byM[m]||[]).push(h);});
  const DOWF=['อา','จ','อ','พ','พฤ','ศ','ส'];
  const body=Object.keys(byM).sort().map(m=>{const md=parse(m+'-01');
    return `<div style="font-size:12px;font-weight:700;color:var(--ink-soft);margin:14px 0 8px">${THAI_M[md.getMonth()]} ${be(md.getFullYear())}</div>`+
    byM[m].map(h=>{const dd=parse(h.date);return `<div class="rec-item" style="border:1px solid var(--line);border-radius:14px;margin-bottom:8px">
      <div style="width:46px;height:46px;border-radius:12px;background:#FDECEC;color:#C0392B;display:flex;flex-direction:column;align-items:center;justify-content:center;flex-shrink:0;line-height:1.1"><b class="mono" style="font-size:17px">${dd.getDate()}</b><span style="font-size:9px">${THAI_MS[dd.getMonth()]}</span></div>
      <div class="rec-b"><div class="rec-t" style="font-size:13.5px">${esc(h.name)}</div><div class="rec-m">วัน${['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัสบดี','ศุกร์','เสาร์'][dd.getDay()]} • ${h.type==='company'?'วันหยุดบริษัท':'วันหยุดราชการ'}</div></div></div>`;}).join('');}).join('');
  openSheet('วันหยุดบริษัท '+be(2026),body);
}

/* ===== TOAST ===== */
let tT;
function toast(msg,kind){const t=document.getElementById('toast');t.innerHTML=(kind==='err'?'':I.check)+'<span>'+msg+'</span>';t.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('show'),2400);}

</script>
